<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedCenter — Financeiro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <div id="app" class="layout">
    <aside class="sidebar">
      <div class="marca">
        <div class="icone"><i class="bi bi-hospital"></i></div>
        <div>
          <div class="nome">MedCenter</div>
          <div class="subtitulo">Hospital Geral</div>
        </div>
      </div>

      <nav>
        <a href="../index.html"><i class="bi bi-grid"></i> Dashboard</a>
        <a href="../pacientes/index.html"><i class="bi bi-people"></i> Pacientes</a>
        <a href="../agenda/index.html"><i class="bi bi-person-badge"></i> Médicos</a>
        <a href="../agenda/index.html"><i class="bi bi-calendar3"></i> Agendamentos</a>
        <a href="../farmacia-exames/index.html"><i class="bi bi-file-earmark-text"></i> Resultados</a>
        <a href="index.html" class="ativo"><i class="bi bi-bar-chart"></i> Financeiro</a>
        <a href="../pacientes/index.html"><i class="bi bi-credit-card-2-front"></i> Convênios</a>
      </nav>

      <div class="rodape-usuario">
        <div class="avatar-circulo">AD</div>
        <div>
          <div class="nome">Administrador</div>
          <div class="email" id="email-usuario"></div>
        </div>
      </div>
    </aside>

    <div class="conteudo">
      <header class="topo">
        <div>
          <h1>Financeiro</h1>
          <p class="data-hoje" id="data-hoje"></p>
        </div>
        <div class="topo-acoes">
          <button class="btn btn-sm btn-outline-secondary" onclick="logout(); location.href='../index.html';">Sair</button>
        </div>
      </header>

      <div class="pagina" id="conteudo-pagina">
        <p class="placeholder-aviso">Carregando dados...</p>
      </div>
    </div>
  </div>

  <script src="../services/api.js"></script>
  <script>
    document.getElementById("data-hoje").textContent = new Date().toLocaleDateString("pt-BR", {
      weekday: "long", day: "2-digit", month: "long", year: "numeric",
    });

    if (!estaLogado()) {
      location.href = "../index.html";
    }

    const CORES_CONVENIO = ["#0f6e56", "#1b5fc2", "#7c3aed", "#b4660a", "#c2255c"];

    function formatarMoeda(valor) {
      return Number(valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    }

    async function carregarFinanceiro() {
      const area = document.getElementById("conteudo-pagina");
      try {
        const [faturamentos, convenios] = await Promise.all([
          apiFetch("/faturamento/"),
          apiFetch("/convenios"),
        ]);

        const mapaConvenios = {};
        convenios.forEach((c) => (mapaConvenios[c.id_convenio] = c.nome));

        const total = faturamentos.reduce((s, f) => s + Number(f.valor_total), 0);
        const porStatus = {};
        const porConvenio = {};

        faturamentos.forEach((f) => {
          porStatus[f.status] = (porStatus[f.status] || 0) + Number(f.valor_total);
          const chave = f.id_convenio ? mapaConvenios[f.id_convenio] || `Convênio #${f.id_convenio}` : "Particular";
          porConvenio[chave] = (porConvenio[chave] || 0) + Number(f.valor_total);
        });

        const linhasConvenio = Object.entries(porConvenio)
          .sort((a, b) => b[1] - a[1])
          .map(([nome, valor], i) => {
            const pct = total > 0 ? Math.round((valor / total) * 100) : 0;
            const cor = CORES_CONVENIO[i % CORES_CONVENIO.length];
            return `
              <div class="barra-convenio">
                <div class="topo-barra"><span>${nome}</span><span>${pct}%</span></div>
                <div class="trilho"><div class="preenchido" style="width:${pct}%;background:${cor};"></div></div>
                <div class="valor">${formatarMoeda(valor)}</div>
              </div>`;
          })
          .join("") || '<p class="placeholder-aviso">Nenhum faturamento cadastrado ainda.</p>';

        const linhasStatus = Object.entries(porStatus)
          .map(([status, valor]) => `
            <div class="lista-item">
              <span class="pill ${status === "pago" ? "pill-sucesso" : status === "cancelado" ? "pill-alerta" : "pill-info"}">${status}</span>
              <span>${formatarMoeda(valor)}</span>
            </div>`)
          .join("") || '<p class="placeholder-aviso">Sem dados.</p>';

        area.innerHTML = `
          <div class="grid-stats">
            <div class="card card-destaque">
              <div class="rotulo">RECEITA TOTAL</div>
              <div class="numero">${formatarMoeda(total)}</div>
              <div class="linha"><span>Faturamentos</span><span>${faturamentos.length}</span></div>
            </div>
            <div class="card card-stat">
              <div class="rotulo">Convênios diferentes
                <div class="icone-stat"><i class="bi bi-credit-card-2-front"></i></div>
              </div>
              <div class="numero">${Object.keys(porConvenio).length}</div>
              <div class="detalhe">incluindo particular</div>
            </div>
            <div class="card card-stat">
              <div class="rotulo">Ticket médio
                <div class="icone-stat" style="background:#e6f7ef;color:#0f7a4d;"><i class="bi bi-graph-up"></i></div>
              </div>
              <div class="numero">${faturamentos.length ? formatarMoeda(total / faturamentos.length) : "—"}</div>
              <div class="detalhe">por faturamento</div>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-lg-7">
              <div class="card">
                <div class="secao-titulo">Receita por convênio</div>
                ${linhasConvenio}
              </div>
            </div>
            <div class="col-lg-5">
              <div class="card">
                <div class="secao-titulo">Receita por status</div>
                ${linhasStatus}
              </div>
            </div>
          </div>

          <p class="placeholder-aviso mt-3">
            Despesas operacionais e evolução mensal ainda não existem no modelo de dados do projeto
            (o sistema só registra receita) — se o grupo quiser esses números, precisa criar uma
            tabela de despesas antes.
          </p>
        `;
      } catch (e) {
        area.innerHTML = `<p class="text-danger">Erro ao carregar: ${e.message}</p>`;
      }
    }

    carregarFinanceiro();
  </script>
</body>
</html>
